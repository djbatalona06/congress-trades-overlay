name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    tags: ['v*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run build:site
      # Packaging only matters for a release.
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm run zip
