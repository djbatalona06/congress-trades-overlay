name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    tags: ['v*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npm run build:firefox
      - run: npm run build:site
      - run: npm run check:site
      # Packaging only matters for a release.
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm run zip

  # Lighthouse on the built website: accessibility must score 95+; the rest only warns.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-site.mjs
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
