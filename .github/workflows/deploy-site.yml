# Builds site/ into site/dist and publishes it to Cloudflare Pages whenever it changes on master.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
# Optional repository variables (public values, not secrets): SITE_CHROME_URL, SITE_FIREFOX_URL,
# SITE_AUTH_BASE, SITE_CONTACT_EMAIL. See scripts/build-site.mjs.
name: Deploy site

on:
  push:
    branches: [master]
    paths: ['site/**', 'scripts/build-site.mjs', '.github/workflows/deploy-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

env:
  PROJECT: capitol-tape
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions."
            exit 1
          fi
      # First run only: make the Pages project. Later runs skip this because it already exists.
      - name: Create Pages project if missing
        run: |
          if ! npx --yes wrangler@4 pages project list | grep -q "\b$PROJECT\b"; then
            npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=master
          fi
      - name: Build site
        run: node scripts/build-site.mjs
        env:
          SITE_CHROME_URL: ${{ vars.SITE_CHROME_URL }}
          SITE_FIREFOX_URL: ${{ vars.SITE_FIREFOX_URL }}
          SITE_AUTH_BASE: ${{ vars.SITE_AUTH_BASE }}
          SITE_CONTACT_EMAIL: ${{ vars.SITE_CONTACT_EMAIL }}
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy site/dist --project-name="$PROJECT" --branch=master --commit-dirty=true
