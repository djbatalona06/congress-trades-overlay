<!-- Head: page title, description, social tags, fonts and the stylesheet. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="theme-color" content="#1e3a5f" />
  <link rel="icon" type="image/svg+xml" href="{{base}}mark.svg" />
  <link rel="alternate icon" type="image/png" href="{{base}}icon.png" />
  <link rel="canonical" href="https://capitol-tape.pages.dev/{{canonical}}" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" />
  <link rel="stylesheet" href="{{base}}styles.css" />
