<!-- Hero: one headline, one subhead, one button, then the product picture. The video is a faint, silent 3-second loop of the chart; decoration only. -->
    <section class="hero" id="top" aria-labelledby="hero-title">
      <video class="hero-video" autoplay muted loop playsinline preload="metadata" poster="{{base}}media/hero-chart-poster.jpg" aria-hidden="true" tabindex="-1">
        <source src="{{base}}media/hero-chart-loop.webm" type="video/webm" />
        <source src="{{base}}media/hero-chart-loop.mp4" type="video/mp4" />
      </video>
      <div class="wrap">
        <h1 id="hero-title" class="reveal">{{title}}</h1>
        <p class="sub reveal d2">{{sub}}</p>
        <div class="cta-row reveal d3">
          <a class="btn btn-primary" href="#get" data-install="chrome">Add to Chrome</a>
        </div>
        <p class="fineprint reveal d4">Free · Desktop only: Chrome and Firefox on a computer, not available on mobile · <a href="#get" data-install="firefox">Get it for Firefox</a></p>
        <!-- @include ProductDemo -->
      </div>
    </section>
