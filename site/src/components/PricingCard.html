<!-- PricingCard: plan name, who it is for, price, a list of Feature items (the block's children) and one button. -->
          <article class="tier{{extra}} reveal {{delay}}">
            {{tag}}<h3>{{name}}</h3>
            <p class="for">{{for}}</p>
            <div class="price"><b>{{price}}</b><span>{{unit}}</span></div>
            <ul>{{children}}
            </ul>
            <a class="btn {{button}}" href="{{href}}"{{install}}>{{cta}}</a>
          </article>
