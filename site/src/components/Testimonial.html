<!-- Testimonial: ONLY for a real, checkable quote. Needs written permission from the person, or a link to
     their public store review in source. Never invent one. Arguments: quote, name, role, source, sourceLabel. -->
          <figure class="quote">
            <blockquote>“{{quote}}”</blockquote>
            <figcaption><div><strong>{{name}}</strong><span>{{role}}</span></div><a class="quote-source" href="{{source}}" target="_blank" rel="noopener noreferrer">{{sourceLabel}}<span class="sr-only"> (opens in a new tab)</span></a></figcaption>
          </figure>
