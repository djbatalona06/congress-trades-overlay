name = "congress-trades-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Run `npx wrangler d1 create congress-trades` and paste the id it prints.
[[d1_databases]]
binding = "DB"
database_name = "congress-trades"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
# Keep in step with the *_CRON constants in src/index.ts.
crons = ["7 * * * *", "17 */6 * * *", "47 4 * * *", "37 * * * *", "27 */6 * * *"]

[vars]
# "bargo" or "none". See README before charging for the data.
TRADE_SOURCE = "bargo"

# Request logs can carry client details; this Worker needs none of them.
[observability]
enabled = false

# Secrets (never in this file):
#   npx wrangler secret put CONGRESS_API_KEY
#   npx wrangler secret put FEC_API_KEY        (free key from api.data.gov; outside money)
#   npx wrangler secret put LDA_API_TOKEN      (optional)
#   npx wrangler secret put BARGO_API_KEY      (optional)
